<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glassmorphism Card Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 50px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    
    /* Subtle background dynamic elements (placed strictly BEHIND text) */
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.7; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
    }
    @keyframes floatCard1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatCard2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashLine {
      to { stroke-dashoffset: -40; }
    }

    .bg-orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: center; }
    .float-card-1 { animation: floatCard1 6s ease-in-out infinite; }
    .float-card-2 { animation: floatCard2 7s ease-in-out infinite; }
    .animated-dash { stroke-dasharray: 8 6; animation: dashLine 2s linear infinite; }
  </style>

  <!-- Base Layer: Canvas Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="340" rx="16" fill="url(#gridPattern)" />

  <!-- DYNAMIC BACKGROUND ELEMENTS (Behind Text & Overlay Cards) -->
  <g class="bg-orb-1">
    <circle cx="200" cy="80" r="160" fill="url(#glowGrad)" />
    <circle cx="1020" cy="260" r="180" fill="url(#glowGrad)" />
  </g>

  <!-- Right Side Decorative Flow / Node Graphics (Behind Text) -->
  <g opacity="0.35">
    <path d="M 750 170 Q 880 70 1020 170 T 1150 170" fill="none" stroke="url(#accentGrad)" stroke-width="3" class="animated-dash" />
    <path d="M 720 220 Q 860 300 1000 200 T 1160 240" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4" />
  </g>

  <!-- Dynamic Glassmorphism Floating Cards (Placed in right quadrant to avoid text overlap) -->
  <g class="float-card-1" transform="translate(820, 45)">
    <rect width="280" height="85" rx="12" fill="url(#glassGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />
    <circle cx="35" cy="42" r="18" fill="#6366f1" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.5" />
    <path d="M 28 42 L 33 47 L 43 37" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="68" y="38" font-family="Segoe UI, sans-serif" font-weight="700" font-size="14" fill="#ffffff">Application Intake</text>
    <text x="68" y="58" font-family="Segoe UI, sans-serif" font-weight="400" font-size="12" fill="#94a3b8">Automated Review &amp; Scoring</text>
  </g>

  <g class="float-card-2" transform="translate(870, 195)">
    <rect width="270" height="85" rx="12" fill="url(#glassGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />
    <circle cx="35" cy="42" r="18" fill="#a855f7" fill-opacity="0.3" stroke="#c084fc" stroke-width="1.5" />
    <path d="M 28 47 L 35 37 L 42 47" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="68" y="38" font-family="Segoe UI, sans-serif" font-weight="700" font-size="14" fill="#ffffff">Lifecycle &amp; Compliance</text>
    <text x="68" y="58" font-family="Segoe UI, sans-serif" font-weight="400" font-size="12" fill="#94a3b8">Audit &amp; Disbursement Tracking</text>
  </g>

  <!-- FOREGROUND LAYER: Text & Primary Information (Guaranteed Clear & Visible) -->
  <g transform="translate(60, 0)">
    <!-- Top Pill Category Badge -->
    <g transform="translate(0, 50)">
      <rect width="240" height="30" rx="15" fill="url(#accentGrad)" opacity="0.9" />
      <text x="120" y="20" class="badge-text" text-anchor="middle">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title-text" filter="url(#glow)">Awesome Grant Management</text>

    <!-- Subtitle -->
    <text x="0" y="190" class="subtitle-text">
      The definitive index of Grantmaking SaaS Platforms &amp; Open-Source Tools
    </text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 230)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="34" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2" />
        <text x="85" y="22" class="badge-text" text-anchor="middle">💼 12+ Top SaaS Suite</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(185, 0)">
        <rect width="185" height="34" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2" />
        <text x="92" y="22" class="badge-text" text-anchor="middle">⚡ Open-Source Core</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(385, 0)">
        <rect width="200" height="34" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2" />
        <text x="100" y="22" class="badge-text" text-anchor="middle">📊 Valuation &amp; Star Metrics</text>
      </g>
    </g>
  </g>
</svg>
